
name: Build ABOUD OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-common

      - name: Configure ABOUD OS
        run: |
          sudo lb config \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --iso-application "ABOUD OS" \
            --iso-volume "ABOUD_OS_1_0"

      - name: Build Linux ISO
        run: sudo lb build

      - name: Prepare download
        run: |
          mkdir -p output
          ISO=$(find . -maxdepth 1 -name "*.iso" -print -quit)
          test -n "$ISO"
          cp "$ISO" output/ABOUD-OS-1.0-amd64.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ABOUD-OS-1.0-amd64
          path: output/ABOUD-OS-1.0-amd64.iso
          
